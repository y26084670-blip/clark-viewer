name: Verify Alt axis mode
on:
  push:
    branches: [work/viewer-alt-axis-mode-20261007]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:release
      - run: npm run build:pages
