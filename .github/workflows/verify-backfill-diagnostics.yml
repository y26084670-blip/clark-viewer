name: Verify backfill diagnostics
on:
  push:
    branches: [work/viewer-h5-ranges-backfill-02-20261007]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test test/resultRangeBackfill.test.js test/viewerToolsMenu.test.js
      - run: npm run build:release
