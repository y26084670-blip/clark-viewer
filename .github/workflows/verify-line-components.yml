name: Verify field line components
on:
  push:
    branches: [work/viewer-line-components-20261007]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply scoped integration
        run: |
          python3 .github/prepare-line-components.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-field-line-components.mjs')
          s = p.read_text()
          replacements = [
            ('page.getByLabel("Величина", { exact: true })', 'page.locator(\'select:has(option[value="As"])\')'),
            ('page.getByLabel("Компонента", { exact: true })', 'page.locator(\'select:has(option[value="norm"])\')'),
          ]
          for before, after in replacements:
              assert before in s, before
              s = s.replace(before, after)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Full tests
        run: |
          mkdir -p /tmp/viewer-line-components
          if npm test -- --test-reporter=tap > /tmp/viewer-line-components/tests.log 2>&1; then
            tail -n 10 /tmp/viewer-line-components/tests.log
          else
            tail -n 90 /tmp/viewer-line-components/tests.log
            exit 1
          fi
      - name: Release and Pages builds
        run: |
          npm run build:release 2>&1 | tee /tmp/viewer-line-components/build-release.log
          npm run build:pages 2>&1 | tee /tmp/viewer-line-components/build-pages.log
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/viewer-browser-tools --no-save --package-lock=false playwright
          if /tmp/viewer-browser-tools/node_modules/.bin/playwright install --with-deps chromium > /tmp/viewer-line-components/install-browser.log 2>&1; then
            tail -n 4 /tmp/viewer-line-components/install-browser.log
          else
            tail -n 60 /tmp/viewer-line-components/install-browser.log
            exit 1
          fi
      - name: Real browser and GIF acceptance
        env:
          PLAYWRIGHT_MODULE: /tmp/viewer-browser-tools/node_modules/playwright/index.mjs
          CHECK_OUTPUT: /tmp/viewer-line-components
        run: node scripts/check-field-line-components.mjs
      - name: Record verification and finalize source branch
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          output = pathlib.Path('/tmp/viewer-line-components')
          result = json.loads((output/'browser.json').read_text())
          assert result['errors'] == [] and result['passed'] >= 17
          text = (output/'tests.log').read_text()
          counts = {name: int(re.search(r'^# '+name+r' (\d+)', text, re.M).group(1)) for name in ['tests','pass','fail','skipped']}
          assert counts['tests'] == counts['pass'] and counts['fail'] == 0 and counts['skipped'] == 0
          result.update(version='4.19.0', base='1f1ed39f93801b366c6c2e6de038a38293294c51', tests=counts,
            workflow='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            inputCommit=os.environ['GITHUB_SHA'], builds={'release':'passed','pages':'passed'},
            limits=['Browser task/reader fixtures, not a user Solver calculation', 'Native Windows directory picker not exercised', 'Global ranges connected to FieldLines only'])
          p=pathlib.Path('docs/verification/field-line-components.json'); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('.github/prepare-line-components.py').unlink()
          pathlib.Path('.github/workflows/verify-line-components.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          git add src test scripts/check-field-line-components.mjs docs/AI_CHART_RENDERING.md docs/AI_RESULT_RANGES.md docs/verification/field-line-components.json README.md package.json package-lock.json
          git add -u .github
          git commit -m 'feat: finalize verified field components and full-cycle line scales'
          git push origin HEAD:work/viewer-line-components-20261007
          git rev-parse HEAD > /tmp/viewer-line-components/final-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-line-components-verification
          path: /tmp/viewer-line-components
          retention-days: 3
