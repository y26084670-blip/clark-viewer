name: Verify HDF5 range backfill
on:
  push:
    branches: [work/viewer-h5-ranges-backfill-20261007]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full tests
        run: npm test
      - name: Release build
        run: npm run build:release
      - name: Pages build
        run: npm run build:pages
      - name: Install browser
        run: |
          npm install --prefix /tmp/viewer-browser-tools --no-save --package-lock=false playwright
          /tmp/viewer-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser FileSystem/HDF5 acceptance
        env:
          PLAYWRIGHT_MODULE: /tmp/viewer-browser-tools/node_modules/playwright/index.mjs
        run: node scripts/check-range-backfill.mjs
